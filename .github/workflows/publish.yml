name: Publish

# Publishes @musthavecat/usedesk-chat to BOTH registries on a semver tag
# (`git tag v0.2.0 && git push --tags`), or on a manual run. Each job maps the
# `@musthavecat` scope to its registry via setup-node, so the same `npm publish`
# lands in the right place. `continue-on-error` tolerates re-running a tag whose
# version already exists in one registry (e.g. publishing an existing version to
# the OTHER registry for the first time).
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  github-packages:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com
          scope: "@musthavecat"
      - run: npm ci
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  npmjs:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          scope: "@musthavecat"
      - run: npm ci
      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
